<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <!-- Creator -->
  <rect x="10" y="14" width="34" height="36" rx="7" fill="#0f766e"/>
  <path d="M18 28h18M18 36h12" stroke="#ecfdf5" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Link -->
  <path d="M44 32 H56" stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 20;20 0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Product: amber box; check optically centered (shifted left for ✓ mass) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 2;0 0;0 2" dur="1.2s" repeatCount="indefinite"/>
    <rect x="58" y="20" width="28" height="24" rx="6" fill="#f59e0b">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <path
      d="M63.5 32 L68 36.5 L77.5 26.5"
      fill="none"
      stroke="#fff7ed"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
